<html lang="de-CH">
<head>

<title>Gassi-Kompass</title>
<meta name="description" content="Hunderegeln für Zürich, Luzern und Bern mit Tagesstatus zur Wald-Leinenpflicht und amtlicher Quelle zu jeder Angabe.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: eine Lesespalte wie ein Wegweiser-Pfosten. Gelbe Richtungstafeln wählen den Ort, darunter hängen Tagesstatus, Regeln, Stadtregeln, Vergleich und Quellen. */
:root{
  --bg:#F3F5F0;--surface:#FFFFFF;--sunk:#E6EBE2;--line:#D2D9CE;
  --ink:#141C16;--ink-2:#4B5750;
  --plate:#F5C518;--plate-ink:#15150A;--plate-off:#E0E5DA;--plate-hover:#EBDC98;
  --must:#B42318;--must-bg:#FCEAE8;
  --free:#1F6E3D;--free-bg:#E3F2E8;
  --note:#2355A0;--note-bg:#E7EEF9;
  --none:#56625A;--none-bg:#EAEEE7;
  --focus:#2355A0;
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1310;--surface:#161D18;--sunk:#1E2721;--line:#2C372F;
    --ink:#E5EBE3;--ink-2:#A0AEA4;
    --plate:#F5C518;--plate-ink:#15150A;--plate-off:#252F28;--plate-hover:#3B3A21;
    --must:#FF8A7D;--must-bg:#3A1A17;
    --free:#7CD39A;--free-bg:#142E1D;
    --note:#94B8F4;--note-bg:#16253E;
    --none:#A6B2A9;--none-bg:#212A24;
    --focus:#94B8F4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1310;--surface:#161D18;--sunk:#1E2721;--line:#2C372F;
  --ink:#E5EBE3;--ink-2:#A0AEA4;
  --plate:#F5C518;--plate-ink:#15150A;--plate-off:#252F28;--plate-hover:#3B3A21;
  --must:#FF8A7D;--must-bg:#3A1A17;
  --free:#7CD39A;--free-bg:#142E1D;
  --note:#94B8F4;--note-bg:#16253E;
  --none:#A6B2A9;--none-bg:#212A24;
  --focus:#94B8F4;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;display:grid;gap:44px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Kopf */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.brand{position:relative;isolation:isolate;display:inline-flex;align-items:center;padding:7px 30px 7px 12px;color:var(--plate-ink);font-weight:800;font-stretch:118%;font-size:1rem;letter-spacing:.01em}
.brand::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--plate);border-radius:3px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%)}
.stamp{font-family:var(--mono);font-size:.76rem;color:var(--ink-2)}

/* Einstieg und Ortswahl */
.hero{display:grid;gap:18px}
h1{margin:0;font-size:clamp(2.1rem,1.2rem + 4vw,3.4rem);line-height:1.04;font-weight:800;font-stretch:116%;letter-spacing:-.012em;max-width:15ch;text-wrap:balance}
.lede{margin:0;color:var(--ink-2);font-size:1.06rem;max-width:58ch}
.picker{display:grid;gap:12px}
.plates{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.plates-label{font-size:.85rem;color:var(--ink-2);margin-right:2px}
.dest{appearance:none;border:0;background:none;font:inherit;cursor:pointer;position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:10px 36px 10px 14px;color:var(--ink);text-align:left;border-radius:4px}
.dest::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--plate-off);border-radius:4px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%);transition:background .15s ease}
.dest:hover::before{background:var(--plate-hover)}
.dest[aria-pressed="true"]{color:var(--plate-ink)}
.dest[aria-pressed="true"]::before{background:var(--plate)}
.dest:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.dest-name{font-weight:780;font-stretch:112%;font-size:1.05rem;line-height:1.2}
.dest-sub{font-family:var(--mono);font-size:.7rem;opacity:.78}
.plates.small .dest{padding:7px 30px 7px 12px}
.plates.small .dest-name{font-size:.92rem}

/* Bausteine */
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.sec{display:grid;gap:16px}
.sec-head{display:grid;gap:4px}
h2{margin:0;font-size:1.45rem;line-height:1.2;font-weight:780;font-stretch:110%;text-wrap:balance}
.sec-head p{margin:0;color:var(--ink-2);max-width:62ch}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:.73rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.chip.must{background:var(--must-bg);color:var(--must)}
.chip.free{background:var(--free-bg);color:var(--free)}
.chip.note{background:var(--note-bg);color:var(--note)}
.chip.none{background:var(--none-bg);color:var(--none)}
.src{font-family:var(--mono);font-size:.72rem;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 10px}
.src a{text-underline-offset:2px}
.src a:hover{color:var(--ink)}
.src a:focus-visible,.foot a:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}

/* Tagesstatus */
.today{display:grid;gap:20px;padding:20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.today-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
.today-date{font-family:var(--mono);font-size:.78rem;color:var(--ink-2)}
.today-body{display:grid;gap:22px}
@media (min-width:780px){.today-body{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:end}}
.today-status{display:grid;gap:10px;min-width:0}
.big{margin:0;font-size:clamp(1.55rem,1.05rem + 2.3vw,2.25rem);line-height:1.1;font-weight:800;font-stretch:112%;text-wrap:balance}
.big.must{color:var(--must)}
.big.free{color:var(--free)}
.today-status p{margin:0;max-width:60ch}
.today-note{padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:.94rem}
.bar{display:grid;gap:6px;padding-top:26px;min-width:0}
.track{position:relative;display:grid;height:36px;border-radius:6px;background:var(--sunk)}
.track .m{border-left:1px solid var(--line)}
.track .m:first-child{border-left:0}
.band{position:absolute;top:0;bottom:0;background:var(--must-bg);border:2px solid var(--must);border-radius:5px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.band span{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--must);white-space:nowrap}
.now{position:absolute;top:-24px;bottom:-5px;width:0;border-left:2px solid var(--ink)}
.now span{position:absolute;top:0;left:0;transform:translateX(-50%);font-family:var(--mono);font-size:.7rem;font-weight:500;white-space:nowrap;background:var(--surface);padding:0 4px;line-height:1.4}
.now.r span{transform:translateX(-100%)}
.now.l span{transform:none}
.months{display:grid;font-family:var(--mono);font-size:.66rem;color:var(--ink-2)}
.months span{padding-left:3px;overflow:hidden}
.bar-cap{margin:0;font-size:.8rem;color:var(--ink-2)}

/* Leine und Zutritt */
.split{display:grid;gap:12px}
@media (min-width:720px){.split{grid-template-columns:1fr 1fr}}
.list-card{padding:16px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;gap:12px;align-content:start;min-width:0}
.list-card h3{margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:1.02rem;font-weight:750}
.list-card p{margin:0;color:var(--ink-2);font-size:.94rem}
.list-card ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.list-card li{position:relative;padding-left:20px}
.list-card li::before{content:"";position:absolute;left:0;top:.55em;width:9px;height:9px;border-radius:2px;background:var(--ink-2)}
.list-card.leash li::before{background:var(--must)}

/* Karten */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{padding:16px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;gap:8px;align-content:start;min-width:0}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:22px}
.card-k{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.card-v{margin:0;font-size:1.22rem;line-height:1.2;font-weight:780;font-stretch:108%}
.card p{margin:0;font-size:.95rem}
.more summary{cursor:pointer;font-size:.88rem;font-weight:650;color:var(--note);width:max-content}
.more summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
.more ul{margin:8px 0 0;padding-left:1.1em;columns:2 9rem;column-gap:16px;font-size:.88rem}

/* Stadt */
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.zone{padding:16px 18px;border-radius:var(--r);background:var(--free-bg);display:grid;gap:8px;align-content:start;min-width:0}
.zone-name{font-size:1.15rem;font-weight:780;font-stretch:110%}
.zone .chip{background:var(--surface)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.zone p{margin:0;font-size:.94rem}
.plain-note{margin:0;padding:16px 18px;border-radius:var(--r);background:var(--sunk);max-width:none}

/* Vergleich */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.92rem}
th,td{padding:11px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
thead th{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
thead th.sel{color:var(--plate-ink);background:var(--plate)}
td.sel{background:var(--sunk);font-weight:600}
tbody th{font-weight:700;width:20%}
.callout{margin:0;display:grid;gap:6px;padding:14px 16px;border-radius:var(--r);background:var(--note-bg)}
.callout p{margin:0}

/* Fuss */
.foot{display:grid;gap:14px;padding-top:22px;border-top:1px solid var(--line);color:var(--ink-2);font-size:.92rem}
.foot p{margin:0;max-width:70ch}
.foot strong{color:var(--ink)}
.foot ol{margin:0;padding-left:1.3em;display:grid;gap:5px;font-size:.84rem}
.foot ol a{color:var(--ink);text-underline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

const CITY=["zuerich","luzern","bern"], KT=["kanton-zh","kanton-lu","kanton-be"];
const ROWS=[["wald","Leine im Wald"],["haft","Haftpflicht"],["kurs","Kurs"],["rassen","Rassen"],["steuer","Hundesteuer"],["anm","Anmeldung"]];

const DAY=864e5;
const mid=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const diff=(a,b)=>Math.round((mid(b)-mid(a))/DAY);
const fmt=(d,y)=>d.toLocaleDateString("de-CH",y?{day:"numeric",month:"long",year:"numeric"}:{day:"numeric",month:"long"});
const tage=n=>n===1?"1 Tag":n+" Tage";
const tagen=n=>n===1?"1 Tag":n+" Tagen";

function season(now){
  const y=now.getFullYear(),t=mid(now),s=new Date(y,3,1),e=new Date(y,6,31);
  if(t>=s&&t<=e) return {active:true,end:e,left:diff(t,e)};
  const next=t<s?s:new Date(y+1,3,1);
  return {active:false,next:next,until:diff(t,next)};
}

function src(keys){
  return '<div class="src"><span>'+(keys.length>1?"Quellen:":"Quelle:")+'</span>'+
    keys.map(k=>'<a href="'+SRC[k].u+'" target="_blank" rel="noopener">'+SRC[k].s+'</a>').join("")+'</div>';
}

function bar(hasSeason,now){
  const y=now.getFullYear(),leap=(y%4===0&&y%100!==0)||y%400===0,total=leap?366:365;
  const days=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31];
  const cols=days.map(d=>d+"fr").join(" ");
  const doy=d=>Math.round((mid(d)-new Date(y,0,1))/DAY);
  const L=doy(new Date(y,3,1))/total*100, W=(doy(new Date(y,7,1))-doy(new Date(y,3,1)))/total*100;
  const N=(doy(now)+.5)/total*100, edge=N>88?"r":(N<12?"l":"");
  const mn=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  const label=(hasSeason?"Leinenpflicht im Wald vom 1. April bis 31. Juli":"Keine saisonale Leinenpflicht im Wald")+". Heute ist der "+fmt(now)+".";
  return '<div class="bar" role="img" aria-label="'+label+'">'+
    '<div class="track" style="grid-template-columns:'+cols+'">'+days.map(()=>'<span class="m"></span>').join("")+
    (hasSeason?'<div class="band" style="left:'+L.toFixed(2)+'%;width:'+W.toFixed(2)+'%"><span>Leine</span></div>':"")+
    '<div class="now '+edge+'" style="left:'+N.toFixed(2)+'%"><span>heute</span></div></div>'+
    '<div class="months" style="grid-template-columns:'+cols+'" aria-hidden="true">'+mn.map(m=>'<span>'+m+'</span>').join("")+'</div>'+
    '<p class="bar-cap">'+(hasSeason?"Brut- und Setzzeit: 1. April bis 31. Juli":"Keine Saisonregel im Kanton")+'</p></div>';
}

function renderToday(pl){
  const c=C[pl.c],now=new Date();
  const dateStr=now.toLocaleDateString("de-CH",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  let big,tone,text;
  if(c.wald.season){
    const s=season(now);
    if(s.active){
      tone="must";big="Heute Leinenpflicht im Wald";
      text="Bis "+fmt(s.end)+" gilt die Leinenpflicht "+c.wald.where+". "+(s.left===0?"Heute ist der letzte Tag.":"Noch "+tage(s.left)+".");
    }else{
      tone="free";big="Heute keine Leinenpflicht im Wald";
      text="Die Leinenpflicht "+c.wald.where+" gilt wieder ab "+fmt(s.next,true)+", also in "+tagen(s.until)+". Bis dahin muss dein Hund trotzdem unter Kontrolle bleiben, und Schilder vor Ort gehen vor.";
    }
  }else{tone="none";big="Keine Saisonregel im Wald";text=c.wald.text;}
  const note=pl.local&&pl.local.todayNote?'<p class="today-note">'+pl.local.todayNote+'</p>':"";
  document.getElementById("today").innerHTML=
    '<div class="today-head"><span class="eyebrow">Heute im Wald · '+c.name+'</span><span class="today-date">'+dateStr+'</span></div>'+
    '<div class="today-body"><div class="today-status"><p class="big '+tone+'">'+big+'</p><p>'+text+'</p>'+note+src(c.wald.src)+'</div>'+bar(c.wald.season,now)+'</div>';
}

function card(x){
  return '<article class="card"><div class="card-top"><span class="card-k">'+x.k+'</span>'+(x.chip?'<span class="chip '+x.tone+'">'+x.chip+'</span>':"")+'</div>'+
    '<p class="card-v">'+x.v+'</p><p>'+x.t+'</p>'+
    (x.more?'<details class="more"><summary>'+x.more.label+'</summary><ul>'+x.more.items.map(i=>'<li>'+i+'</li>').join("")+'</ul></details>':"")+
    src(x.src)+'</article>';
}

function renderLocal(pl){

}

    '</tbody></table></div>'+
    '<div class="callout"><p><strong>Umzug in den Kanton Zürich:</strong> Die Kurspflicht gilt auch bei Zuzug. Hunde der Rassetypenliste II dürfen nicht zuziehen.</p>'+src(["zh_vet","srf"])+'</div>';
}

function plate(id){
  const p=P[id];
  return '<button type="button" class="dest" id="dest-'+id+'" data-place="'+id+'" aria-pressed="false"><span class="dest-name">'+p.label+'</span><span class="dest-sub">'+p.sub+'</span></button>';
}

let current=null;
function show(id){
  if(!P[id]) id="zuerich";
  if(id===current) return;
  current=id;
  document.querySelectorAll(".dest").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.place===id)));
  const pl=P[id];
  renderToday(pl);renderRules(pl);renderLocal(pl);renderCompare(pl);
  try{localStorage.setItem("gk-place",id)}catch(e){}
}

document.getElementById("plates-city").innerHTML=CITY.map(plate).join("");
document.getElementById("plates-kt").insertAdjacentHTML("beforeend",KT.map(plate).join(""));
document.querySelectorAll(".dest").forEach(b=>b.addEventListener("click",()=>{
  const id=b.dataset.place;
  if(location.hash.slice(1)!==id){location.hash=id}else{show(id)}
}));
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
renderFoot();
let start=location.hash.slice(1);
if(!P[start]){try{start=localStorage.getItem("gk-place")||""}catch(e){start=""}}
show(P[start]?start:"zuerich");
})();
