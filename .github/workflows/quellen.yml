# Prüft alle Quellen-Links mit einem echten Abruf. Start von Hand:
#   gh workflow run quellen.yml -R Josidos/gassi-kompass
# Ergebnis: gh run view <Nummer> -R Josidos/gassi-kompass --log
# Die Action wird nie rot. Was «tot» und «unklar» heisst, steht in tools/links.py.
name: Quellen-Links prüfen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Links prüfen
        run: python3 tools/links.py
