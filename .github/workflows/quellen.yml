# Prüft alle Quellen-Links mit einem echten Abruf. Läuft einmal pro Woche von selbst, am Freitag um 04:17 UTC
# (Entscheid von Joss vom 27. November 2026). Start von Hand nur in einer Sitzung und auf sein Wort:
#   gh api -X POST repos/Josidos/gassi-kompass/actions/workflows/quellen.yml/dispatches -f ref=main
# Ergebnis: gh run view <Nummer> -R Josidos/gassi-kompass --log
# Die Action wird nie rot. Was «tot» und «unklar» heisst, steht in tools/links.py.
name: Quellen-Links prüfen

on:
  schedule:
    - cron: '17 4 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Links prüfen
        run: python3 tools/links.py
